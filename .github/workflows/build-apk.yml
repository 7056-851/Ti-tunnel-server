name: Construir APK Mi Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar proyecto Android
        working-directory: mi_tunnel_app
        run: flutter create --platforms=android --project-name mi_tunnel .

      - name: Permitir acceso a Internet
        working-directory: mi_tunnel_app
        run: sed -i '/<application/i\    <uses-permission android:name=\"android.permission.INTERNET\" />' android/app/src/main/AndroidManifest.xml

      - name: Descargar dependencias
        working-directory: mi_tunnel_app
        run: flutter pub get

      - name: Configurar Android API 36
        working-directory: mi_tunnel_app
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          config_path = Path(".dart_tool/package_config.json")
          config = json.loads(config_path.read_text())
          app = Path("android/app/build.gradle.kts")
          if not app.exists():
              app = Path("android/app/build.gradle")
          targets = [app]
          wanted = {"file_picker", "file_picker_android", "flutter_plugin_android_lifecycle"}
          for package in config["packages"]:
              if package["name"] not in wanted:
                  continue
              uri = package["rootUri"]
              if uri.startswith("file:"):
                  root = Path(unquote(urlparse(uri).path))
              else:
                  root = (config_path.parent / unquote(uri)).resolve()
              for filename in ("build.gradle", "build.gradle.kts"):
                  candidate = root / "android" / filename
                  if candidate.exists():
                      targets.append(candidate)
          for path in targets:
              source = path.read_text()
              value = "compileSdk = 36" if path.suffix == ".kts" else "compileSdkVersion 36"
              updated, count = re.subn(r"(?m)^(\s*)compileSdk(?:Version)?\s*(?:=\s*)?.*$", lambda m: m.group(1) + value, source)
              if count == 0:
                  raise SystemExit("No se encontró compileSdk en " + str(path))
              path.write_text(updated)
              print("API 36 configurada:", path)
          PY

      - name: Compilar APK
        working-directory: mi_tunnel_app
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tunnel-APK
          path: mi_tunnel_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
