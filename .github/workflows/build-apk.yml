name: Construir APK Mi Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar proyecto Android
        working-directory: mi_tunnel_app
        run: flutter create --platforms=android --project-name mi_tunnel .

      - name: Permitir acceso a Internet
        working-directory: mi_tunnel_app
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Descargar dependencias
        working-directory: mi_tunnel_app
        run: flutter pub get

      - name: Configurar Android API 36
        working-directory: mi_tunnel_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              Path("android/app").glob("build.gradle*"),
              Path.home().glob(".pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle*"),
              Path.home().glob(".pub-cache/hosted/pub.dev/flutter_plugin_android_lifecycle-*/android/build.gradle*"),
          ]

          files = [p for group in patterns for p in group]
          if not files:
              raise SystemExit("No se encontraron archivos Gradle")

          for path in files:
              content = path.read_text()
              content, a = re.subn(
                  r'(?m)^(\s*)compileSdk\s*=\s*.*$',
                  r'\1compileSdk = 36',
                  content
              )
              content, b = re.subn(
                  r'(?m)^(\s*)compileSdkVersion\s*(?:=\s*)?.*$',
                  r'\1compileSdkVersion 36',
                  content
              )
              if a + b:
                  path.write_text(content)
                  print(f"API 36 configurada: {path}")

          app_files = list(Path("android/app").glob("build.gradle*"))
          if not any("compileSdk = 36" in p.read_text() or "compileSdkVersion 36" in p.read_text() for p in app_files):
              raise SystemExit("ERROR: no se pudo configurar API 36 en la aplicación")
          PY

      - name: Compilar APK
        working-directory: mi_tunnel_app
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tunnel-APK
          path: mi_tunnel_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
